<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kehua Lei - Researcher</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    // 自定义宽度，确保布局精确
                    spacing: {
                        '105': '420px', 
                        '120': '480px', // 新增宽度
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        html { scroll-behavior: smooth; }
        
        /* 隐藏滚动条但保留功能，为了更整洁的左侧栏 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-white text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const Github = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36.5-8 0C6 2 5 2 4 3c-2.5 0-4 1.5-4 3.5.03 3.5 3 5.5 6 5.5-.73 1.03-1.09 2.25-1 3.5v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>;
        const Linkedin = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>;
        const ExternalLink = ({size=14, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>;
        const BookOpen = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
        const Twitter = ({size=20, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-12.7 12.5S.2 5.3 4.1 9c-3.1.4-4.6-2.9-4.6-2.9 2.1.6 3.6 0 3.6 0-2 0-3-1-3-1 2.9 1.1 3.2 1.2 3.2 1.2C3 5.5 2.5 4 2.5 4 6 7 10 7 11 6c-1-5 5-7 5-7 .6 2 2.4 2.5 2.4 2.5z"/></svg>;
        const MapPin = ({size=14, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;

        // --- Data ---
        const DATA = {
            name: "Kehua Lei",
            title: "Ph.D. in Computational Media",
            institution: "University of California, Santa Cruz",
            department: "Baskin School of Engineering",
            email: "kehualei@gmail.com",
            
            // [操作指南] 替换照片：
            // 1. 将你的照片放在和 index.html 同一个文件夹下
            // 2. 将下方链接改为 "./你的照片文件名.jpg"
            avatar: "./photo.png", 
            
            socials: {
                twitter: "https://twitter.com",
                linkedin: "https://linkedin.com",
                github: "https://github.com",
                scholar: "https://scholar.google.com/citations?user=Ss_xRa8AAAAJ&hl=en&oi=ao",
                
                // [操作指南] 替换CV：
                // 1. 将你的PDF文件放在和 index.html 同一个文件夹下
                // 2. 将下方链接改为 "./你的简历文件名.pdf"
                cv: "./cv.pdf"
            },

            bio_paragraphs: [
                <span>
                    I am a recent Ph.D. graduate in Computational Media from the University of California, Santa Cruz, where I was advised by <a href="https://tech4good.soe.ucsc.edu/people" className="text-blue-600 border-b border-blue-200 hover:text-blue-800 hover:border-blue-800 transition-colors" target="_blank">Prof. David Lee</a> at the <a href="https://tech4good.soe.ucsc.edu/" className="text-blue-600 border-b border-blue-200 hover:text-blue-800 hover:border-blue-800 transition-colors" target="_blank">Tech4Good Lab</a>.
                </span>,
                "My research interests lie at the intersection of Human-Computer Interaction (HCI), Social Computing, and Computer-Supported Cooperative Work (CSCW). I explore how digital technologies can better support meaningful collaboration, communication grounded in deep listening, and relationship-building in online environments.",
                <span>
                    My doctoral research initially focused on designing for large-scale online communication, investigating how digital platforms could realize the unique affordances of scale to enable collective experiences beyond conventional small-group models. Extending this line of inquiry, Human-Centered AI and human-AI collaboration have become a central focus of my recent work, guiding my investigation into how LLMs can understand and generate contextually sensitive language to mediate human-to-human relationships. These inquiries are synthesized in my dissertation, <i className="font-serif">"Designing for Meaningful Large-Scale Online Communication, Connection, and Collective Insight"</i> (Committee: <a href="https://tech4good.soe.ucsc.edu/people" className="text-blue-600 border-b border-blue-200 hover:text-blue-800 hover:border-blue-800 transition-colors" target="_blank">Prof. David Lee</a>, <a href="https://users.soe.ucsc.edu/~normsu/" className="text-blue-600 border-b border-blue-200 hover:text-blue-800 hover:border-blue-800 transition-colors" target="_blank">Prof. Norman Su</a>, <a href="https://luzhc.github.io/" className="text-blue-600 border-b border-blue-200 hover:text-blue-800 hover:border-blue-800 transition-colors" target="_blank">Prof. Zhicong Lu</a>).
                </span>,
                "Prior to my Ph.D., I received my Master’s degree in Computer Science and Technology from Tsinghua University, and a B.S. in Industrial Design from Hunan University.",
                "I am currently on the job market for Postdoctoral and Research positions. I would be happy to connect and discuss potential collaborations."
            ],

            news: [
                { date: "Jan 2026", text: "Two papers accepted to CHI '26." },
                { date: "Oct 2025", text: <span>Our paper <i className="italic">"Dynamic Surveys: Using LLMs to Blend Qualitative Depth, Quantitative Structure, and Collaborative Interaction"</i> received an <b>Honorable Mention</b> at CSCW '25!</span> },
                { date: "Sep 2025", text: "Successfully defended my Ph.D. dissertation." },
                { date: "June 2025", text: "Two papers accepted to CSCW '25." }
            ],

            publications: [
                {
                    id: 1,
                    title: "Dynamic Surveys: Using LLMs to Blend Qualitative Depth, Quantitative Structure, and Collaborative Interaction",
                    authors: "Kehua Lei, Aidan Ladenburg, Zahra Kais Petiwala, Zili Wang, Dishita Jhawar, Ipsita Bisht, Ansh Kumar, David T Lee",
                    venue: "CSCW 2025",
                    award: "Honorable Mention",
                    link: "https://dl.acm.org/doi/abs/10.1145/3757586",
                    pdf: "https://dl.acm.org/doi/pdf/10.1145/3757586",
                    year: "2025"
                },
                {
                    id: 2,
                    title: "Exploring Communal Gratitude in Online Communities",
                    authors: "Kehua Lei, Kathleen Lum, Namrata Keskar, Saba Kheirinejad, Shivani Potnuru, Amy Xing, Reina Itakura, Simo Hosio, David T Lee",
                    venue: "CSCW 2025",
                    link: "https://dl.acm.org/doi/abs/10.1145/3710972",
                    pdf: "https://dl.acm.org/doi/pdf/10.1145/3710972",
                    year: "2025"
                },
                {
                    id: 3,
                    title: "Compass: Supporting large group mentorship in a chat-based UI",
                    authors: "Kehua Lei, Mingrui Yu, Marissa Lewellen, Venus Ku, David T Lee",
                    venue: "CSCW 2023",
                    link: "https://dl.acm.org/doi/abs/10.1145/3579470",
                    pdf: "https://dl.acm.org/doi/pdf/10.1145/3579470",
                    year: "2023"
                }
            ]
        };

        const Sidebar = () => {
            return (
                <aside className="
                    md:fixed md:top-0 md:left-0 md:h-screen 
                    w-full md:w-120 
                    bg-white
                    border-r border-slate-100 
                    pt-12 md:pt-24 pb-12 
                    pl-8 md:pl-36 pr-8
                    flex flex-col 
                    no-scrollbar overflow-y-auto
                ">
                    
                    <div className="mb-10">
                        {/* 调整：mb-6 改为 mb-8，与右侧的 Hello 标题下边距对齐，确保照片和正文水平对齐 */}
                        <h1 className="font-serif text-3xl md:text-4xl font-medium text-slate-900 mb-10 tracking-tight leading-tight">
                            {DATA.name}
                        </h1>
                        <div className="w-48 h-48 rounded-lg overflow-hidden mb-8 shadow-sm bg-slate-200">
                           <img 
                              src={DATA.avatar} 
                              alt={DATA.name} 
                              className="w-full h-full object-cover"
                              onError={(e) => {
                                e.target.onerror = null; 
                                e.target.src='https://via.placeholder.com/400?text=Photo';
                              }}
                           />
                        </div>
                        
                        <div className="text-sm space-y-2 text-slate-600 font-light leading-relaxed">
                            <p className="font-medium text-slate-900 text-base">{DATA.title}</p>
                            <p>{DATA.department}</p>
                            <p>{DATA.institution}</p>
                            
                            <div className="pt-3">
                                <a href={`mailto:${DATA.email}`} className="text-slate-900 hover:text-blue-600 transition-colors border-b border-slate-300 hover:border-blue-600 pb-0.5">
                                    {DATA.email}
                                </a>
                            </div>
                        </div>
                    </div>

                    <nav className="space-y-3 mb-12 hidden md:block">
                        {['About', 'News', 'Publications', 'Teaching', 'CV'].map((item) => {
                            // 特殊处理 CV 链接，使其可以点击下载
                            if (item === 'CV') {
                                return (
                                     <a 
                                        key={item} 
                                        href={DATA.socials.cv}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="block text-slate-500 hover:text-blue-600 hover:translate-x-1 transition-all duration-300 font-medium"
                                    >
                                        CV
                                    </a>
                                );
                            }
                            return (
                                <a 
                                    key={item} 
                                    href={`#${item.toLowerCase()}`}
                                    className="block text-slate-500 hover:text-blue-600 hover:translate-x-1 transition-all duration-300 font-medium"
                                >
                                    {item}
                                </a>
                            );
                        })}
                    </nav>

                    {/* 已移除底部的社交媒体图标区域 */}
                </aside>
            );
        };

        const MainContent = () => {
            return (
                <div className="md:ml-120 flex-1 min-h-screen">
                    <div className="max-w-3xl mx-auto px-8 md:px-20 pt-12 md:pt-24 pb-20 space-y-24">
                        
                        <section id="about" className="space-y-8 animate-fade-in">
                            <h2 className="font-serif text-3xl md:text-4xl text-slate-900 mb-8 font-medium">Hello!</h2>
                            
                            <div className="prose prose-slate prose-lg text-slate-700 leading-relaxed font-light">
                                {DATA.bio_paragraphs.map((para, idx) => (
                                    <p key={idx} className="mb-6">{para}</p>
                                ))}
                            </div>
                        </section>

                        <section id="news">
                            <h2 className="font-serif text-2xl text-slate-900 mb-8 border-b border-slate-100 pb-3">Update</h2>
                            <div className="space-y-8">
                                {DATA.news.map((item, idx) => (
                                    <div key={idx} className="flex flex-col sm:flex-row sm:items-baseline gap-2 sm:gap-10 group">
                                        <div className="w-24 shrink-0 text-sm font-bold text-slate-900 font-mono">{item.date}</div>
                                        <div className="text-slate-700 leading-relaxed group-hover:text-slate-900 transition-colors">
                                            {item.text}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section id="publications">
                            <h2 className="font-serif text-2xl text-slate-900 mb-8 border-b border-slate-100 pb-3">Selected Publications</h2>
                            <div className="space-y-10">
                                {DATA.publications.map((pub) => (
                                    <div key={pub.id} className="group">
                                        <div className="text-lg font-medium text-slate-900 leading-snug mb-2 group-hover:text-blue-700 transition-colors">
                                            <a href={pub.link}>{pub.title}</a>
                                        </div>
                                        <div className="text-slate-600 mb-2 font-light">
                                            {pub.authors.split(',').map((author, i, arr) => (
                                                <span key={i} className={author.includes("Kehua") ? "font-semibold text-slate-900" : ""}>
                                                    {author.trim()}{i < arr.length - 1 ? ", " : ""}
                                                </span>
                                            ))}
                                        </div>
                                        <div className="flex items-center gap-4 text-sm text-slate-500 font-mono">
                                            <span className="font-bold text-slate-700">{pub.venue}</span>
                                            {pub.award && <span className="text-amber-600 font-medium bg-amber-50 px-2 py-0.5 rounded">★ {pub.award}</span>}
                                            <div className="flex gap-4 ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
                                                <a href={pub.pdf} className="hover:text-blue-600 hover:underline flex items-center">PDF</a>
                                                <a href={pub.link} className="hover:text-blue-600 hover:underline flex items-center">DOI</a>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-10 pt-4">
                                <a href={DATA.socials.scholar} className="inline-flex items-center text-sm font-medium text-slate-900 hover:text-blue-600 border-b border-slate-300 hover:border-blue-600 transition-all pb-0.5">
                                    View full list on Google Scholar <ExternalLink size={12} className="ml-1" />
                                </a>
                            </div>
                        </section>

                        <section id="contact" className="pt-12 border-t border-slate-100 text-slate-500 text-sm font-light">
                            <p className="leading-relaxed">
                                I'm always looking forward to discussions and collaborations! <br/>
                                Feel free to email me at <a href={`mailto:${DATA.email}`} className="text-slate-700 border-b border-slate-300 hover:text-blue-600">{DATA.email}</a>.
                            </p>
                        </section>

                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <div className="min-h-screen bg-white text-slate-900 font-sans flex flex-col md:flex-row">
                    <Sidebar />
                    <MainContent />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
